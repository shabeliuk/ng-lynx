packages:
  - packages/*
  - examples/*

# Pins Angular 21 for the workspace's own builds and tests. CI's Angular 22 lane replaces them.
overrides:
  '@angular/core': 21.2.26
  '@angular/compiler': 21.2.26
  '@angular/common': 21.2.26
  '@angular/router': 21.2.26
  '@angular/localize': 21.2.26
  '@angular/platform-browser': 21.2.26
  '@angular/forms': 21.2.26
  # Patched versions of packages that sparkling-app-cli's own rspeedy 0.13 pulls in.
  '@rsdoctor/rspack-plugin@<1.5.16': ^1.6.5
  'body-parser@1': ^1.20.9
  'qs@6': ^6.16.1
  'serialize-javascript@<7.1.3': ^7.1.3
  # GHSA-g3hv-75wg-m249. typedoc (in @lynx-js/genui, for its catalog extractor) asks for
  # minimatch ^10, and even its newest 0.28 has no fixed 10.x. 11 is the fix;
  # verify:genui-tools runs the extractor through typedoc on it. Drop when typedoc moves.
  'minimatch@>=7.0.0 <11.0.1': ^11.0.9

# Install scripts that may run. esbuild's checks its native binary; the others only
# print a donation message (core-js) or send install telemetry (@openuidev/lang-core).
allowBuilds:
  esbuild: true
  core-js: false
  '@openuidev/lang-core': false
