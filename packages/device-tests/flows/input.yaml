# Typing on the native keyboard reaches `(input)`, and Return fires `(confirm)`. Then
# `[(ngModel)]`: on Android, typing with the cursor moved back into the text inserts
# there. iOS has no key to move the cursor with.
appId: ${APP_ID}
---
- runFlow:
    file: shared/open.yaml
    env:
      BUNDLE: main
      READY: 'Count: 0'
- scrollUntilVisible:
    element: Open input
    direction: DOWN
    timeout: 10000
- tapOn: Open input
- extendedWaitUntil:
    visible: 'Typed: '
    timeout: 5000
- tapOn: Name field
- inputText: Ada
- extendedWaitUntil:
    visible: 'Typed: Ada'
    timeout: 5000
- pressKey: Enter
- extendedWaitUntil:
    visible: 'Confirmed: Ada'
    timeout: 5000
- tapOn: Model field
- inputText: abcd
- extendedWaitUntil:
    visible: 'Model: abcd'
    timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Remote Dpad Left
      - pressKey: Remote Dpad Left
      - inputText: XY
      - extendedWaitUntil:
          visible: 'Model: abXYcd'
          timeout: 5000
- takeScreenshot: input
