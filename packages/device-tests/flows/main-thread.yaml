# A worklet bound to a tap reports back with runOnBackground, and runOnMainThread
# returns a value across the threads. A third worklet stops its tap from bubbling.
# <lynx-slider> drags on the Main Thread here, since this build has worklets. Two
# 'main thread' functions written in the component run there too.
appId: ${APP_ID}
---
- runFlow:
    file: shared/open.yaml
    env:
      BUNDLE: main
      READY: 'Count: 0'
- scrollUntilVisible:
    element: Open main thread
    direction: DOWN
    timeout: 10000
- tapOn: Open main thread
- extendedWaitUntil:
    visible: 'Main taps: 0'
    timeout: 5000
- tapOn: Tap on main thread
- extendedWaitUntil:
    visible: 'Main taps: 1'
    timeout: 5000
- tapOn: Tap on main thread
- extendedWaitUntil:
    visible: 'Main taps: 2'
    timeout: 5000
- tapOn: Call main thread
- extendedWaitUntil:
    visible: 'Result: 42'
    timeout: 5000
# The worklet stops the tap, so the outer box's (tap) doesn't count it, and reports
# a live currentTarget with its dataset and uid.
- tapOn: Stop on main thread
- extendedWaitUntil:
    visible: 'Stop: function stopper number'
    timeout: 5000
- tapOn: Outer area
- extendedWaitUntil:
    visible: 'Outer taps: 1'
    timeout: 5000
- assertNotVisible: 'Outer taps: 2'
# Past the right end clamps to max. Maestro's left swipe ends a few points inside
# the track's start, so it lands on 0 or 10.
# The slider is brought to the middle of the screen first: a horizontal swipe that
# starts near Android's navigation handle is taken by the system, and the slider gets
# touchcancel. On CI's 320x640 emulator it sat right above the handle.
- scrollUntilVisible:
    element: Volume slider
    direction: DOWN
    centerElement: true
    timeout: 30000
- extendedWaitUntil:
    visible: 'Volume: 50'
    timeout: 5000
- swipe:
    from: Volume slider
    direction: RIGHT
- extendedWaitUntil:
    visible: 'Volume: 100'
    timeout: 5000
- swipe:
    from: Volume slider
    direction: LEFT
- extendedWaitUntil:
    visible: 'Volume: (0|10)'
    timeout: 5000
# Two 'main thread' functions written in the component: a tap that counts in a ref
# and reports through a Background function, and a method runOnMainThread calls.
- scrollUntilVisible:
    element: Inline tap
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: Inline tap
- extendedWaitUntil:
    visible: 'Inline taps: 1'
    timeout: 5000
- tapOn: Inline tap
- extendedWaitUntil:
    visible: 'Inline taps: 2'
    timeout: 5000
- tapOn: Call inline
- extendedWaitUntil:
    visible: 'Inline result: 42'
    timeout: 5000
- takeScreenshot: main-thread
