name: Release

# Publish ng-lynx and create-ng-lynx to npm when a GitHub Release is
# published. The release's tag must match the version in both package.json files.
on:
  release:
    types: [published]
  # Allow a manual dry run (packs the tarball, does not publish).
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack only, do not publish'
        type: boolean
        default: true

# `id-token: write` lets npm trusted publishing log in with this workflow's OIDC
# identity, with no token stored in the repo, and signs the provenance: a
# verifiable link from each published package back to this run and commit.
# Set it up once per package on npmjs.com: Settings → Trusted publishing →
# GitHub Actions, repository shabeliuk/ng-lynx, workflow release.yml.
permissions:
  contents: read
  id-token: write

# Opt out of the install-time telemetry `@openuidev/lang-core` reports from its
# `postinstall` (a transitive dependency of `@lynx-js/genui`). Same setting as
# ci.yml — see its comment and docs/39-lynx-4-1.md.
env:
  DO_NOT_TRACK: '1'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      - name: Build ng-lynx
        run: pnpm --filter ng-lynx build

      - name: Typecheck and verify
        run: |
          pnpm --filter ng-lynx typecheck
          pnpm --filter ng-lynx verify:all

      # Guard: the published versions must match the release tag (e.g. tag
      # `v0.1.0` ⇒ package version `0.1.0`). Skipped for manual dispatch.
      - name: Check versions match tag
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          for pkg in ng-lynx create-ng-lynx; do
            PKG_VERSION="$(node -p "require('./packages/$pkg/package.json').version")"
            if [ "$PKG_VERSION" != "$TAG" ]; then
              echo "::error::$pkg version ($PKG_VERSION) != release tag ($TAG)"
              exit 1
            fi
          done

      # A prerelease (`0.1.0-rc.0`) goes out under its own dist-tag (`rc`), so
      # `npm install ng-lynx` keeps giving the latest stable version.
      - name: Pick the dist-tag
        id: dist-tag
        run: |
          VERSION="$(node -p "require('./packages/ng-lynx/package.json').version")"
          case "$VERSION" in
            *-*) TAG="${VERSION#*-}"; TAG="${TAG%%.*}" ;;
            *) TAG=latest ;;
          esac
          echo "Publishing $VERSION under the '$TAG' dist-tag"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish (with provenance)
        if: github.event_name == 'release' || inputs.dry-run == false
        run: |
          (cd packages/ng-lynx && npm publish --provenance --access public --tag "$TAG")
          (cd packages/create-ng-lynx && npm publish --provenance --access public --tag "$TAG")
        env:
          TAG: ${{ steps.dist-tag.outputs.tag }}
          # Only used if trusted publishing isn't set up for a package yet.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run (nothing is uploaded)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run == true
        run: |
          (cd packages/ng-lynx && npm publish --dry-run --access public --tag "$TAG")
          (cd packages/create-ng-lynx && npm publish --dry-run --access public --tag "$TAG")
        env:
          TAG: ${{ steps.dist-tag.outputs.tag }}
