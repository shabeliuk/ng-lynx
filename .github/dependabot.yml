# Dependabot version updates: one grouped PR a week per lockfile.
# Security alerts still show on the repo's Security tab; fix PRs for them are off in Settings.
version: 2
updates:
  # The pnpm workspace: packages/*, examples/* and the templates share the root lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Angular moves as one set, and the overrides in pnpm-workspace.yaml must move with it.
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', '@ngtools/*']
        update-types: [minor, patch]
      lynx:
        patterns: ['@lynx-js/*', 'sparkling-app-cli']
        update-types: [minor, patch]
      everything-else:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Major versions are a deliberate change: the supported Angular range, TypeScript, rspeedy.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # No fix we can reach: deepmerge, from @rsbuild/plugin-sass, has no fixed release.
      # Drop this once upstream moves. (minimatch is pinned to 11 by an override in
      # pnpm-workspace.yaml, until typedoc moves off 10.)
      - dependency-name: deepmerge
      # genui minors are breaking (0.x), and ng-lynx's peer range stops below 0.9: move to a new
      # minor by hand, re-running the genui harnesses. 0.8 patches still come through.
      - dependency-name: '@lynx-js/genui'
        versions: ['>=0.9.0']

  # CocoaPods tooling for the genui example's native iOS app.
  - package-ecosystem: bundler
    directory: /examples/genui/ios
    schedule:
      interval: monthly
    groups:
      ios-tooling:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # The actions the workflows use.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
